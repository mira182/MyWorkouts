<div class="flex flex-col">
  <button mat-stroked-button (click)="openSelectExerciseDialog()">
    @if (!selectedExercise()) {
      <span>Select exercise...</span>
      }@if (selectedExercise(); as selectedExercise) {
      <span>{{selectedExercise.name}}</span>
    }
  </button>

  <mat-form-field>
    <mat-label>Chart type</mat-label>
    <mat-select [formControl]="selectedChartTypeControl" (selectionChange)="chartTypeSelected()">
      @for (chartType of exerciseChartType; track chartType) {
        <mat-option [value]="chartType.value">
          {{chartType.text}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <app-chips-time-select [interval]="currentInterval" (chipSelected)="intervalSelected($event)"></app-chips-time-select>

  <div class="grow flex justify-center max-h-80 min-h-[160px] m-4 relative">
    <canvas id="workoutExerciseChart" [attr.aria-label]="'HISTORY.title' | translate" role="img"></canvas>

    @if (!selectedExercise()) {
      <div class="absolute inset-0 flex items-center justify-center text-center opacity-70 px-4">
        {{ 'DASHBOARD.select-exercise-hint' | translate }}
      </div>
    } @else if (noData()) {
      <div class="absolute inset-0 flex items-center justify-center text-center opacity-70 px-4">
        {{ 'DASHBOARD.no-data-period' | translate }}
      </div>
    }

    <ngx-spinner
      bdColor="rgba(51,51,51,0.8)"
      size="medium"
      color="#fff"
      type="ball-spin"
      [fullScreen]="false"
    ></ngx-spinner>
  </div>
</div>
