<div>
  <mat-form-field>
    <mat-label>{{'TITLES.workouts' | translate}}</mat-label>
    <mat-select [formControl]="selectWorkoutControl" [compareWith]="compareChartTypes" (selectionChange)="updateChart(currentInterval)">
      @for (group of workoutGroups; track group) {
        <mat-optgroup [label]="group.groupName">
          @for (chart of group.charts; track chart) {
            <mat-option [value]="chart">
              {{chart.viewValue}}
            </mat-option>
          }
        </mat-optgroup>
      }
    </mat-select>
  </mat-form-field>

  <app-chips-time-select [interval]="currentInterval" (chipSelected)="updateMonthInterval($event)"></app-chips-time-select>


  <div class="grow flex justify-center max-h-80 min-h-[160px] m-4 relative">
    <canvas id="workoutChart" [attr.aria-label]="'TITLES.workouts' | translate" role="img"></canvas>

    @if (noData()) {
      <div class="absolute inset-0 flex items-center justify-center text-center opacity-70 px-4">
        {{ 'DASHBOARD.no-data-period' | translate }}
      </div>
    }

    <ngx-spinner
      bdColor="rgba(51,51,51,0.8)"
      size="medium"
      color="#fff"
      type="ball-spin"
      [fullScreen]="false"
    ></ngx-spinner>
  </div>
</div>
